<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050c16">
    <meta http-equiv="refresh" content="0; url=workstation.html">
    <title>CMSys Documents — Command Deck</title>
    <link rel="icon" type="image/png" href="logo-crest.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(900px 520px at 20% 0%, rgba(47, 227, 196, .12), transparent 60%),
                radial-gradient(800px 520px at 80% 100%, rgba(226, 178, 90, .09), transparent 60%),
                #050c16;
            color: #eaf2ff;
            font-family: 'Google Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 34px 38px;
            border-radius: 22px;
            border: 1px solid rgba(151, 190, 235, .17);
            background: linear-gradient(160deg, rgba(20, 40, 62, .9), rgba(7, 16, 28, .95));
            box-shadow: 0 40px 100px -40px #000;
            text-align: center;
        }
        .crest {
            width: 74px; height: 74px;
            display: grid; place-items: center;
            border-radius: 20px;
            border: 1px solid rgba(226, 178, 90, .35);
            background: radial-gradient(circle at 50% 30%, rgba(226, 178, 90, .22), transparent 70%);
        }
        .crest img { width: 52px; height: 52px; object-fit: contain; }
        h1 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
        h1 span { color: #2fe3c4; }
        p { margin: 0; font-size: 11.5px; color: #8fa3bf; max-width: 330px; line-height: 1.6; }
        .bar { width: 190px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
        .bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #12b39c, #2fe3c4); animation: sweep 1.2s cubic-bezier(.4, 0, .2, 1) infinite; }
        a {
            margin-top: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #2fe3c4;
            text-decoration: none;
            border-bottom: 1px solid rgba(47, 227, 196, .35);
            padding-bottom: 2px;
        }
        @keyframes sweep {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(360%); }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="crest"><img src="logo-crest.png" alt="Sri Lanka Navy crest"></div>
        <h1><span>CMSys</span> Documents</h1>
        <p>Opening the Naval Correspondence &amp; Registry Command Deck…</p>
        <div class="bar"><i></i></div>
        <a href="workstation.html">Enter workstation</a>
    </div>
    <script>window.location.replace('workstation.html');</script>
</body>
</html>
